name: Release

# Started by hand from main (Publishing to Maven Central and packaging the CLI). The release is cut only from a
# commit that passed the gate, which is why the workflow, not a person, makes the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.2.0'
        required: true
      next:
        description: 'Next development version, e.g. 0.3.0-SNAPSHOT'
        required: true

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and verify
        run: ./mvnw -B verify -pl '!oracle-it'
      # The 50k release gate per Oracle-verified system runs here, sharded, once oracle-it provides it.

  jlink:
    needs: gate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set the release version
        shell: bash
        run: ./mvnw -B -q versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false
      - name: Build the modular jars
        shell: bash
        run: ./mvnw -B -q package -DskipTests -pl cli -am
      - name: Link a runtime image
        shell: bash
        run: |
          mkdir -p image-lib
          cp core/target/*.jar trf/target/*.jar cli/target/fide-swiss-pairing-engine-cli-*.jar image-lib/
          jlink --module-path image-lib --add-modules io.github.markdechamps.fideswiss.cli \
            --launcher fide-swiss=io.github.markdechamps.fideswiss.cli/io.github.markdechamps.fideswiss.cli.Main \
            --strip-debug --no-header-files --no-man-pages \
            --output fide-swiss-${{ inputs.version }}-${{ matrix.platform }}
          7z a fide-swiss-${{ inputs.version }}-${{ matrix.platform }}.zip fide-swiss-${{ inputs.version }}-${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.platform }}
          path: fide-swiss-${{ inputs.version }}-${{ matrix.platform }}.zip

  publish:
    needs: [gate, jlink]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
      - name: Version, changelog and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          ./mvnw -B -q versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false
          sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${{ inputs.version }}] - $(date +%Y-%m-%d)/" CHANGELOG.md
          git commit -am "Release ${{ inputs.version }}"
          git tag v${{ inputs.version }}
      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -Prelease deploy -DskipTests
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      - name: Release notes
        run: |
          awk '/^## \[${{ inputs.version }}\]/{flag=1;next}/^## \[/{flag=0}flag' CHANGELOG.md > notes.md
          sha256sum cli/target/fide-swiss-${{ inputs.version }}.zip cli/target/fide-swiss-${{ inputs.version }}.tar.gz fide-swiss-*-*.zip > SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:main v${{ inputs.version }}
          gh release create v${{ inputs.version }} --title "${{ inputs.version }}" --notes-file notes.md \
            cli/target/fide-swiss-${{ inputs.version }}.zip cli/target/fide-swiss-${{ inputs.version }}.tar.gz \
            fide-swiss-*-*.zip SHA256SUMS
      - name: Next development version
        run: |
          ./mvnw -B -q versions:set -DnewVersion=${{ inputs.next }} -DgenerateBackupPoms=false
          git commit -am "Start ${{ inputs.next }}"
          git push origin HEAD:main
