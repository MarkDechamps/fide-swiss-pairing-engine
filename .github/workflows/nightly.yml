name: Nightly

on:
  schedule:
    - cron: '0 3 * * 1-6'
    # Sundays also run the mutation tests.
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Pinned Oracles, fetched and built here and run as separate processes; nothing of them is committed
      # (Verification strategy).
      - name: Build bbpPairings v6.0.0 and v5.0.1
        run: |
          for version in 6.0.0 5.0.1; do
            curl -fsSL "https://github.com/BieremaBoyzProgramming/bbpPairings/archive/refs/tags/v${version}.tar.gz" | tar -xz
            make -C "bbpPairings-${version}"
          done
      # JaVaFo refuses plain curl (HTTP 999); its licence has no redistribution grant, so it is used here only.
      - name: Fetch JaVaFo 2.2
        continue-on-error: true
        run: curl -fsSL -A "Mozilla/5.0" -o javafo.jar https://www.rrweb.org/javafo/current/javafo.jar
      # Gacrux (FIDE's TieBreakServer), the Swiss Team System Oracle, pinned to the commit its Known Divergences
      # were measured on; its Python needs networkx only.
      - name: Fetch Gacrux @ 6419149 and its Python environment
        run: |
          git clone https://github.com/OttoMilvang/TieBreakServer.git TieBreakServer
          git -C TieBreakServer checkout 6419149ede24fa76639a956b1a52ccac0ded730d
          python3 -m venv gacrux-venv
          gacrux-venv/bin/pip install networkx
      # 1,000 generated tournaments per Oracle-backed scope (the release gate runs 50,000), from a corpus seed that rotates each night.
      - name: Oracle comparison runs
        env:
          FIDESWISS_ORACLE_BBP6: ${{ github.workspace }}/bbpPairings-6.0.0/build/bbpPairings.exe
          FIDESWISS_ORACLE_BBP5: ${{ github.workspace }}/bbpPairings-5.0.1/build/bbpPairings.exe
          FIDESWISS_ORACLE_JAVAFO: ${{ github.workspace }}/javafo.jar
          FIDESWISS_ORACLE_GACRUX: ${{ github.workspace }}/TieBreakServer
          FIDESWISS_ORACLE_GACRUX_PYTHON: ${{ github.workspace }}/gacrux-venv/bin/python
        run: >-
          ./mvnw -B verify -pl oracle-it -am -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false
          -Dfideswiss.oracle.tournaments=1000 -Dfideswiss.oracle.seed=$(date +%Y%m%d)
      # Every Dutch tournament accelerated by Baku (fictitious points as XXA), and team tournaments with withdrawals and late entries.
      - name: Oracle comparison runs, accelerated and with membership changes
        env:
          FIDESWISS_ORACLE_BBP6: ${{ github.workspace }}/bbpPairings-6.0.0/build/bbpPairings.exe
          FIDESWISS_ORACLE_BBP5: ${{ github.workspace }}/bbpPairings-5.0.1/build/bbpPairings.exe
          FIDESWISS_ORACLE_JAVAFO: ${{ github.workspace }}/javafo.jar
          FIDESWISS_ORACLE_GACRUX: ${{ github.workspace }}/TieBreakServer
          FIDESWISS_ORACLE_GACRUX_PYTHON: ${{ github.workspace }}/gacrux-venv/bin/python
        run: |
          ./mvnw -B verify -pl oracle-it -am -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=DutchOracleIT -Dfideswiss.oracle.baku=100 \
            -Dfideswiss.oracle.tournaments=500 -Dfideswiss.oracle.seed=$(date +%Y%m%d)
          ./mvnw -B verify -pl oracle-it -am -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=SwissTeamOracleIT -Dfideswiss.oracle.events=forfeits,byes,withdrawals,late-entries \
            -Dfideswiss.oracle.tournaments=200 -Dfideswiss.oracle.seed=$(date +%Y%m%d)
          # The FIDE-literal readings (ADR 0009) against Gacrux patched with tpn-order.
          ./mvnw -B verify -pl oracle-it -am -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=SwissTeamOracleIT -Dfideswiss.oracle.gacrux.literal=true \
            -Dfideswiss.oracle.tournaments=100 -Dfideswiss.oracle.seed=$(date +%Y%m%d)
      - name: Keep the inputs of every difference
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-failures
          path: oracle-it/target/oracle-failures/

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # 5,000 generated tournaments per system and edition, from a corpus seed that rotates each night.
      - name: Invariant checker on the generated corpus
        run: >-
          ./mvnw -B test -pl generator -am -Dtest=InvariantRunTest -Dsurefire.failIfNoSpecifiedTests=false
          -Dfideswiss.invariant.tournaments=5000 -Dfideswiss.invariant.seed=$(date +%Y%m%d)

  mutation:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 0'
    timeout-minutes: 240
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Mutation testing on core
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage -pl core -Dthreads=4
